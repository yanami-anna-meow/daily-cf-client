name: Quality checks

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Use the standard Intel image while hosted macOS arm64 capacity is constrained.
        os: [windows-latest, macos-15-intel, ubuntu-24.04]
    env:
      DAILY_CF_REPOSITORY: Yawn-Sean/Daily_CF_Problems
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      # Limit concurrent TypeScript, packaging, and Git fixtures on shared runners.
      - run: npm test -- --maxWorkers=2
      - run: npm run build

