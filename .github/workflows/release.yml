name: Build desktop installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag matching package.json (for example, v0.3.24)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: installers-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: metadata
        name: Check tag, version, and release notes
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/verify-release.mjs metadata

  build:
    name: Package ${{ matrix.platform }} ${{ matrix.arch == 'x64' && 'x86_64' || matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: x64
            os: windows-latest
            arguments: --win --x64
            smoke: true
          - platform: windows
            arch: arm64
            os: windows-latest
            arguments: --win --arm64
            smoke: false
          - platform: macos
            arch: x64
            os: macos-15-intel
            arguments: --mac --x64 --config.mac.identity=-
            smoke: true
          # Cross-package on Intel while hosted Apple Silicon capacity is constrained.
          - platform: macos
            arch: arm64
            os: macos-15-intel
            arguments: --mac --arm64 --config.mac.identity=-
            smoke: false
          - platform: linux
            arch: x64
            os: ubuntu-24.04
            arguments: --linux --x64
            smoke: true
          - platform: linux
            arch: arm64
            os: ubuntu-24.04-arm
            arguments: --linux --arm64
            smoke: true
    env:
      # Release builds always use the official problem repository.
      DAILY_CF_REPOSITORY: Yawn-Sean/Daily_CF_Problems
      GITHUB_CLIENT_ID: ${{ vars.DAILY_CF_GITHUB_CLIENT_ID }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Require publisher OAuth application
        run: node -e "if (!process.env.GITHUB_CLIENT_ID?.trim()) throw new Error('Set repository variable DAILY_CF_GITHUB_CLIENT_ID before building installers');"
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y xvfb libgtk-3-0 libnss3 libasound2t64
      # Do not use the host's electronDist: the Windows and macOS ARM builds cross-package.
      - name: Build and package
        run: npm run dist -- ${{ matrix.arguments }} --publish never
      - name: Verify packaged runtime, files, and installers
        run: node scripts/verify-release.mjs package ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Start the packaged application
        if: matrix.smoke && runner.os != 'Linux'
        run: node scripts/verify-release.mjs smoke ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Start the packaged application with Xvfb
        if: matrix.smoke && runner.os == 'Linux'
        run: xvfb-run --auto-servernum node scripts/verify-release.mjs smoke ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Save validation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: ignore
          retention-days: 14
          path: test-results/release-*.json
      - name: Save installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daily-cf-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb

  draft-release:
    name: Assemble draft release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: daily-cf-*
          merge-multiple: true
          path: installers
      - name: Verify all twelve installers and generate SHA-256 checksums
        run: node scripts/verify-release.mjs assemble installers
      - name: Create a draft for manual publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT" || {
              echo 'Release tag points to a different commit.' >&2; exit 1;
            }
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true || {
              echo 'Refusing to replace an already published release.' >&2; exit 1;
            }
            gh release edit "$RELEASE_TAG" --target "$RELEASE_COMMIT" --title "Daily CF Client $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          else
            gh release create "$RELEASE_TAG" --draft --target "$RELEASE_COMMIT" --title "Daily CF Client $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" installers/* --clobber
