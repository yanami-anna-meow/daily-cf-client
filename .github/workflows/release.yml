name: Build desktop installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            arguments: --win --x64 --config.electronDist=node_modules/electron/dist
          - platform: macos
            os: macos-15-intel
            arguments: --mac --x64 --arm64
          - platform: linux
            os: ubuntu-24.04
            arguments: --linux --x64
    env:
      # Test repository overrides are deliberately not accepted by this workflow.
      DAILY_CF_REPOSITORY: Yawn-Sean/Daily_CF_Problems
      GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Require publisher OAuth application
        run: node -e "if (!process.env.GITHUB_CLIENT_ID?.trim()) throw new Error('Set repository variable GITHUB_CLIENT_ID before building installers');"
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "const version = require('./package.json').version; if (process.env.GITHUB_REF_NAME !== 'v' + version) throw new Error('Tag must match package.json version');"
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - name: Build and package
        run: npm run dist -- ${{ matrix.arguments }} --publish never
      - name: Save installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daily-cf-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap

  draft-release:
    name: Assemble draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: daily-cf-*
          merge-multiple: true
          path: installers
      - name: Generate SHA-256 checksums
        working-directory: installers
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Create a draft for manual release review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]; then
              echo 'Refusing to replace assets of an already published release.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --draft --prerelease --title "Daily CF $RELEASE_TAG" --notes "Cross-platform preview build. These installers are unsigned. Verify SHA256SUMS.txt, platform smoke checks, and GitHub login before publication."
          fi
          gh release upload "$RELEASE_TAG" installers/* --clobber

